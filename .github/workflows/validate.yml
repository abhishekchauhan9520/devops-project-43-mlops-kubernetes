name: Validate MLOps Kubernetes

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: azure/setup-kubectl@v4
        with:
          version: latest
      - name: Validate manifests
        run: ./tests/test_manifests.sh
      - name: Render staging
        run: kubectl kustomize k8s/overlays/staging > /tmp/staging.yaml
      - name: Render production
        run: kubectl kustomize k8s/overlays/production > /tmp/production.yaml
      - name: Check rendered output
        run: |
          grep -q 'kind: Deployment' /tmp/staging.yaml
          grep -q 'kind: HorizontalPodAutoscaler' /tmp/staging.yaml
          grep -q 'kind: NetworkPolicy' /tmp/production.yaml
