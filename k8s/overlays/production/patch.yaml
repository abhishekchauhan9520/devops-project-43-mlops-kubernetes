apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-server
spec:
  replicas: 3
  template:
    metadata:
      labels:
        model-version: v1
      annotations:
        mlops.example.com/model-alias: champion
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: model-server
spec:
  minReplicas: 3
  maxReplicas: 10
